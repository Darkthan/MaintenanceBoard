<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Impressions – MaintenanceBoard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
<div id="layout-root"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
document.getElementById('layout-root').innerHTML = getLayoutTemplate('Impressions', 'printer-logs') + `
  <div class="space-y-5">
    <section id="import-section" class="hidden rounded-xl border border-slate-200 bg-white p-5">
      <h2 class="font-semibold text-slate-800">Importer un journal RISO</h2>
      <p class="mt-1 text-sm text-slate-500">Déposez un ou plusieurs CSV exportés par les imprimantes. Chaque fichier est traité ; un nouveau dépôt met à jour les opérations existantes.</p>
      <form id="import-form" class="mt-4 flex flex-wrap items-center gap-3">
        <div id="drop-zone" class="w-full max-w-lg rounded-lg border-2 border-dashed border-slate-300 p-4 text-sm text-slate-600">
          <p>Glissez le fichier CSV ici ou choisissez-le ci-dessous.</p>
          <input id="csv-file" type="file" accept=".csv,text/csv" multiple required class="mt-2 block w-full text-sm" />
        </div>
        <button id="import-button" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">Importer le CSV</button>
      </form>
      <p id="import-result" role="status" class="mt-3 text-sm text-slate-600"></p>
      <ul id="import-details" class="mt-2 max-h-64 overflow-y-auto space-y-1 text-sm text-slate-600"></ul>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white p-5">
      <h2 class="font-semibold text-slate-800">Analyser les impressions</h2>
      <p class="mt-1 text-sm text-slate-500">Les faces imprimées reprennent « Print count » du journal RISO : le recto verso y compte déjà deux faces. Grayscale est compté en noir et blanc. Les opérations suspendues restent incluses si elles ont imprimé des faces ; le mode Auto reste séparé.</p>
      <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-8">
        <label class="text-xs font-medium text-slate-600">Imprimante<select id="printer-filter" class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm"><option value="">Toutes</option></select></label>
        <label class="text-xs font-medium text-slate-600">Utilisateur<select id="owner-filter" class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm"><option value="">Tous</option></select></label>
        <label class="text-xs font-medium text-slate-600">Type<select id="kind-filter" class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm"><option value="">Tous</option><option value="Copy" selected>Copie</option><option value="Print">Impression</option><option value="Scan">Scan</option></select></label>
        <label class="text-xs font-medium text-slate-600">Couleur<select id="color-filter" class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm"><option value="">Toutes</option></select></label>
        <label class="text-xs font-medium text-slate-600">Recto verso<select id="duplex-filter" class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm"><option value="">Tous</option></select></label>
        <label class="text-xs font-medium text-slate-600">Statut<select id="status-filter" class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm"><option value="">Tous</option><option value="Done">Terminé</option><option value="Suspend">Suspendu</option><option value="Error">Erreur</option></select></label>
        <label class="text-xs font-medium text-slate-600">Du<input id="from-filter" type="date" class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm" /></label>
        <label class="text-xs font-medium text-slate-600">Au<input id="to-filter" type="date" class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm" /></label>
      </div>
    </section>

    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-5">
      <div class="rounded-xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">Opérations</p><p id="jobs-total" class="mt-1 text-3xl font-bold text-slate-900">0</p></div>
      <div class="rounded-xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">Noir et blanc</p><p id="black-total" class="mt-1 text-3xl font-bold text-slate-900">0</p></div>
      <div class="rounded-xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">Couleur</p><p id="color-total" class="mt-1 text-3xl font-bold text-slate-900">0</p></div>
      <div class="rounded-xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">Auto / autre</p><p id="other-total" class="mt-1 text-3xl font-bold text-slate-900">0</p></div>
      <div class="rounded-xl border border-blue-200 bg-blue-50 p-5"><p class="text-sm text-blue-700">Total des faces imprimées</p><p id="copies-total" class="mt-1 text-3xl font-bold text-blue-900">0</p></div>
    </div>

    <section class="overflow-hidden rounded-xl border border-slate-200 bg-white">
      <div class="border-b border-slate-200 px-5 py-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div><h2 class="font-semibold text-slate-800">Regroupement des opérations</h2><p class="mt-1 text-xs text-slate-500">La vue démarre par utilisateur. Ajoutez ensuite les critères utiles, dans l’ordre souhaité.</p></div>
          <div class="flex flex-wrap gap-2">
            <button id="export-summary" type="button" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Exporter le regroupement CSV</button>
            <button id="export-copies" type="button" class="rounded-lg border border-blue-300 bg-blue-50 px-3 py-2 text-sm font-medium text-blue-800 hover:bg-blue-100 disabled:opacity-40">Exporter les copies CSV</button>
          </div>
        </div>
        <div id="group-controls" class="mt-4 flex flex-wrap gap-3"></div>
        <button id="add-group" type="button" class="mt-3 rounded-lg border border-blue-300 px-3 py-2 text-sm font-medium text-blue-700 hover:bg-blue-50">+ Ajouter un critère</button>
        <div class="mt-4 border-t border-slate-100 pt-3">
          <p class="text-xs font-medium text-slate-600">Colonnes de la synthèse</p>
          <div id="summary-columns" class="mt-2 flex flex-wrap gap-x-5 gap-y-2"></div>
        </div>
        <p class="mt-2 text-xs text-slate-500">L’export des copies contient chaque opération « Copie » correspondant aux filtres, même si le tableau regroupe aussi les impressions.</p>
      </div>
      <div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead id="summary-head" class="bg-slate-50 text-slate-600"></thead><tbody id="summary-body" class="divide-y divide-slate-100"></tbody></table></div>
      <p id="summary-empty" class="hidden p-5 text-sm text-slate-500">Aucune opération pour ces filtres.</p>
    </section>

    <section class="overflow-hidden rounded-xl border border-slate-200 bg-white">
      <div class="border-b border-slate-200 px-5 py-4"><div class="flex flex-wrap items-center justify-between gap-3"><h2 class="font-semibold text-slate-800">Journal des opérations</h2><div class="flex items-center gap-3 text-sm"><button id="previous-page" class="rounded border border-slate-300 px-3 py-1 disabled:opacity-40">Précédent</button><span id="page-label"></span><button id="next-page" class="rounded border border-slate-300 px-3 py-1 disabled:opacity-40">Suivant</button></div></div><details class="mt-3 text-sm"><summary class="cursor-pointer font-medium text-blue-700">Choisir les colonnes du journal</summary><div id="job-columns" class="mt-3 flex flex-wrap gap-x-5 gap-y-2"></div></details></div>
      <div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead id="jobs-head" class="bg-slate-50 text-slate-600"></thead><tbody id="jobs-body" class="divide-y divide-slate-100"></tbody></table></div>
    </section>
  </div>`;

const $ = id => document.getElementById(id);
const number = value => Number(value || 0).toLocaleString('fr-FR');
const kindLabel = { Copy: 'Copie', Print: 'Impression', Scan: 'Scan' };
const statusLabel = { Done: 'Terminé', Suspend: 'Suspendu', Error: 'Erreur' };
const groupOptions = [
  ['ownerName', 'Utilisateur'], ['jobKind', 'Type'], ['printerId', 'Imprimante'],
  ['color', 'Mode couleur'], ['duplex', 'Recto verso'], ['paperSize', 'Papier'], ['status', 'Statut']
];
const summaryColumnOptions = [
  ['jobs', 'Opérations'], ['blackCount', 'Noir et blanc'], ['colorCount', 'Couleur'],
  ['otherCount', 'Auto / autre'], ['printCount', 'Total faces']
];
const jobColumnOptions = [
  ['date', 'Date', row => row.startedAt.slice(0, 16).replace('T', ' ')],
  ['owner', 'Utilisateur', row => row.ownerName || 'Utilisateur inconnu'],
  ['printer', 'Imprimante', row => row.printer.name],
  ['kind', 'Type', row => kindLabel[row.jobKind] || row.jobKind],
  ['sourceColor', 'Couleur source', row => row.color || '—'],
  ['countedColor', 'Couleur comptée', row => row.countedColor || '—'],
  ['duplex', 'Recto verso', row => row.duplex || '—'],
  ['paper', 'Papier', row => row.paperSize || '—'],
  ['status', 'Statut', row => statusLabel[row.status] || row.status],
  ['printCount', 'Faces imprimées', row => number(row.printCount)]
];
let page = 1;
let groups = ['ownerName'];
let currentJobs = [];

function selectedGroups() {
  return groups;
}

function selectedSummaryColumns() {
  return [...$('summary-columns').querySelectorAll('input:checked')].map(input => input.value);
}

function renderGroupControls() {
  $('group-controls').replaceChildren();
  groups.forEach((field, index) => {
    const row = document.createElement('div');
    row.className = 'flex items-end gap-2';
    const label = document.createElement('label');
    label.className = 'text-xs font-medium text-slate-600';
    label.textContent = `Critère ${index + 1}`;
    const select = document.createElement('select');
    select.className = 'mt-1 block min-w-40 rounded-lg border border-slate-300 p-2 text-sm';
    for (const [value, name] of groupOptions) {
      if (value === field || !groups.includes(value)) select.add(new Option(name, value));
    }
    select.value = field;
    select.addEventListener('change', () => { groups[index] = select.value; renderGroupControls(); load(); });
    label.appendChild(select);
    row.appendChild(label);
    if (groups.length > 1) {
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50';
      remove.textContent = 'Retirer';
      remove.setAttribute('aria-label', `Retirer le critère ${index + 1}`);
      remove.addEventListener('click', () => { groups.splice(index, 1); renderGroupControls(); load(); });
      row.appendChild(remove);
    }
    $('group-controls').appendChild(row);
  });
  $('add-group').disabled = groups.length === groupOptions.length;
  $('add-group').classList.toggle('opacity-40', $('add-group').disabled);
}

$('add-group').addEventListener('click', () => {
  const next = groupOptions.find(([field]) => !groups.includes(field));
  if (!next) return;
  groups.push(next[0]);
  renderGroupControls();
  load();
});
renderGroupControls();

for (const [field, label] of summaryColumnOptions) {
  const wrapper = document.createElement('label');
  wrapper.className = 'flex items-center gap-2 text-sm text-slate-700';
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.value = field;
  input.checked = true;
  input.className = 'rounded border-slate-300';
  input.addEventListener('change', () => {
    if (!selectedSummaryColumns().length) { input.checked = true; return; }
    if (currentSummary) renderSummary(currentSummary);
  });
  wrapper.append(input, label);
  $('summary-columns').appendChild(wrapper);
}
let currentSummary;

for (const [field, label] of jobColumnOptions) {
  const wrapper = document.createElement('label');
  wrapper.className = 'flex items-center gap-2 text-sm text-slate-700';
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.value = field;
  input.checked = true;
  input.className = 'rounded border-slate-300';
  input.addEventListener('change', () => {
    if (!$('job-columns').querySelector('input:checked')) { input.checked = true; return; }
    renderJobs();
  });
  wrapper.append(input, label);
  $('job-columns').appendChild(wrapper);
}

function renderJobs() {
  const selected = new Set([...$('job-columns').querySelectorAll('input:checked')].map(input => input.value));
  const columns = jobColumnOptions.filter(([field]) => selected.has(field));
  const header = document.createElement('tr');
  for (const [field, label] of columns) {
    const th = document.createElement('th');
    th.className = 'p-3' + (field === 'printCount' ? ' text-right' : '');
    th.textContent = label;
    header.appendChild(th);
  }
  $('jobs-head').replaceChildren(header);
  $('jobs-body').replaceChildren();
  for (const row of currentJobs) addRow($('jobs-body'), columns.map(([, , value]) => value(row)), 0);
  for (const row of $('jobs-body').rows) {
    columns.forEach(([field], index) => {
      if (field === 'printCount') row.cells[index].classList.add('text-right');
    });
  }
}

function groupValue(row, field) {
  if (field === 'printerId') return `${row.printerName} (${row.printerSerial})`;
  if (field === 'jobKind') return kindLabel[row.jobKind] || row.jobKind;
  if (field === 'status') return statusLabel[row.status] || row.status;
  return row[field] || (field === 'ownerName' ? 'Utilisateur inconnu' : '—');
}

function renderSummary(summary) {
  currentSummary = summary;
  const columns = selectedSummaryColumns();
  const header = document.createElement('tr');
  for (const label of [...summary.groupBy.map(field => groupOptions.find(option => option[0] === field)[1]), ...columns.map(field => summaryColumnOptions.find(option => option[0] === field)[1])]) {
    const th = document.createElement('th');
    th.className = 'p-3' + (summaryColumnOptions.some(option => option[1] === label) ? ' text-right' : '');
    th.textContent = label;
    header.appendChild(th);
  }
  $('summary-head').replaceChildren(header);
  $('summary-body').replaceChildren();
  summary.rows.sort((a, b) => b.printCount - a.printCount);
  for (const row of summary.rows) {
    addRow($('summary-body'), [...summary.groupBy.map(field => groupValue(row, field)), ...columns.map(field => number(row[field]))], columns.length);
  }
  $('summary-empty').classList.toggle('hidden', summary.rows.length > 0);
}

function addRow(body, values, numericColumns = 1) {
  const tr = document.createElement('tr');
  values.forEach((value, index) => {
    const td = document.createElement('td');
    td.className = 'p-3 text-slate-700' + (index >= values.length - numericColumns ? ' text-right' : '');
    td.textContent = value ?? '—';
    tr.appendChild(td);
  });
  body.appendChild(tr);
}

function query() {
  const params = new URLSearchParams();
  for (const [id, key] of [['printer-filter', 'printerId'], ['owner-filter', 'ownerName'], ['kind-filter', 'jobKind'], ['color-filter', 'color'], ['duplex-filter', 'duplex'], ['status-filter', 'status'], ['from-filter', 'from'], ['to-filter', 'to']]) {
    if ($(id).value) params.set(key, $(id).value);
  }
  return params;
}

async function load() {
  try {
    const params = query();
    const summaryParams = new URLSearchParams(params);
    summaryParams.set('groupBy', selectedGroups().join(','));
    const jobParams = new URLSearchParams(params);
    jobParams.set('page', String(page));
    const [summary, jobs] = await Promise.all([
      api.get('/printer-logs/summary?' + summaryParams),
      api.get('/printer-logs/jobs?' + jobParams)
    ]);
    $('jobs-total').textContent = number(summary.totals.jobs);
    $('black-total').textContent = number(summary.totals.blackCount);
    $('color-total').textContent = number(summary.totals.colorCount);
    $('other-total').textContent = number(summary.totals.otherCount);
    $('copies-total').textContent = number(summary.totals.printCount);
    renderSummary(summary);
    $('export-copies').disabled = !['', 'Copy'].includes($('kind-filter').value);
    currentJobs = jobs.rows;
    renderJobs();
    $('page-label').textContent = `${jobs.total ? (page - 1) * jobs.pageSize + 1 : 0}–${Math.min(page * jobs.pageSize, jobs.total)} sur ${number(jobs.total)}`;
    $('previous-page').disabled = page <= 1;
    $('next-page').disabled = page * jobs.pageSize >= jobs.total;
  } catch (error) { showToast(error.message, 'error'); }
}

async function loadFilters() {
  const data = await api.get('/printer-logs/filters');
  const printerValue = $('printer-filter').value;
  const ownerValue = $('owner-filter').value;
  const colorValue = $('color-filter').value;
  const duplexValue = $('duplex-filter').value;
  $('printer-filter').replaceChildren(new Option('Toutes', ''));
  $('owner-filter').replaceChildren(new Option('Tous', ''));
  $('color-filter').replaceChildren(new Option('Toutes', ''));
  $('duplex-filter').replaceChildren(new Option('Tous', ''));
  for (const item of data.printers) $('printer-filter').add(new Option(`${item.name} (${item.serial})`, item.id));
  for (const name of data.owners) $('owner-filter').add(new Option(name, name));
  for (const color of data.colors) $('color-filter').add(new Option(color, color));
  for (const duplex of data.duplexes) $('duplex-filter').add(new Option(duplex, duplex));
  $('printer-filter').value = printerValue;
  $('owner-filter').value = ownerValue;
  $('color-filter').value = colorValue;
  $('duplex-filter').value = duplexValue;
}

for (const id of ['printer-filter', 'owner-filter', 'kind-filter', 'color-filter', 'duplex-filter', 'status-filter', 'from-filter', 'to-filter']) {
  $(id).addEventListener('change', () => { page = 1; load(); });
}
async function downloadCsv(path, filename) {
  const blob = await api.get(path);
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$('export-summary').addEventListener('click', () => {
  const params = query();
  params.set('groupBy', selectedGroups().join(','));
  params.set('columns', selectedSummaryColumns().join(','));
  downloadCsv('/printer-logs/summary/export?' + params, 'synthese-impressions.csv')
    .catch(error => showToast(error.message, 'error'));
});
$('export-copies').addEventListener('click', () => {
  const params = query();
  params.delete('jobKind');
  downloadCsv('/printer-logs/copies/export?' + params, 'copies-riso.csv')
    .catch(error => showToast(error.message, 'error'));
});
for (const eventName of ['dragenter', 'dragover']) {
  $('drop-zone').addEventListener(eventName, event => { event.preventDefault(); $('drop-zone').classList.add('border-blue-500', 'bg-blue-50'); });
}
for (const eventName of ['dragleave', 'drop']) {
  $('drop-zone').addEventListener(eventName, event => { event.preventDefault(); $('drop-zone').classList.remove('border-blue-500', 'bg-blue-50'); });
}
$('drop-zone').addEventListener('drop', event => {
  if (!$('import-button').disabled && event.dataTransfer?.files?.length) $('csv-file').files = event.dataTransfer.files;
});
$('previous-page').addEventListener('click', () => { if (page > 1) { page--; load(); } });
$('next-page').addEventListener('click', () => { page++; load(); });
$('import-form').addEventListener('submit', async event => {
  event.preventDefault();
  if ($('import-button').disabled) return;
  const files = [...$('csv-file').files];
  if (!files.length) return;
  $('import-button').disabled = true;
  $('csv-file').disabled = true;
  $('import-details').replaceChildren();
  const totals = { success: 0, imported: 0, updated: 0, unchanged: 0 };
  try {
    for (const [index, file] of files.entries()) {
      $('import-result').textContent = `Fichier ${index + 1}/${files.length} : ${file.name}…`;
      const item = document.createElement('li');
      try {
        const data = new FormData();
        data.append('file', file);
        const result = await api.upload('/printer-logs/import', data);
        totals.success++;
        for (const key of ['imported', 'updated', 'unchanged']) totals[key] += result[key];
        item.textContent = `${file.name} — ${result.printer.name} : ${number(result.imported)} nouvelles opérations, ${number(result.updated)} mises à jour, ${number(result.unchanged)} déjà présentes.`;
      } catch (error) {
        item.className = 'text-red-700';
        item.textContent = `${file.name} — Échec : ${error.message}`;
      }
      $('import-details').appendChild(item);
    }
    $('import-result').textContent = `${totals.success}/${files.length} fichiers traités, ${files.length - totals.success} en échec. ${number(totals.imported)} nouvelles opérations, ${number(totals.updated)} mises à jour, ${number(totals.unchanged)} déjà présentes.`;
    page = 1;
    await loadFilters();
    await load();
  } catch (error) { showToast(error.message, 'error'); }
  finally { $('import-button').disabled = false; $('csv-file').disabled = false; }
});

requireLogin().then(async user => {
  renderNav('printer-logs');
  $('import-section').classList.toggle('hidden', user.role !== 'ADMIN');
  await loadFilters();
  await load();
}).catch(error => showToast(error.message, 'error'));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Noms des imprimantes – MaintenanceBoard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
<div id="layout-root"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
document.getElementById('layout-root').innerHTML = getLayoutTemplate('Noms des imprimantes', 'printer-logs') + `
  <div class="space-y-5">
    <a href="/printer-logs.html" class="inline-flex items-center gap-2 text-sm font-medium text-blue-700 hover:underline">← Retour à l’analyse des impressions</a>
    <section id="printer-management-section" class="hidden rounded-xl border border-slate-200 bg-white p-5">
      <h2 class="font-semibold text-slate-800">Modifier les noms des imprimantes</h2>
      <p class="mt-2 text-sm text-slate-500">Le numéro de série est conservé. Les noms enregistrés ici restent inchangés lors des prochains imports CSV.</p>
      <div id="printer-name-list" class="mt-4 space-y-3"></div>
    </section>

  </div>`;
const $ = id => document.getElementById(id);
const number = value => Number(value || 0).toLocaleString('fr-FR');
const printerNameDrafts = new Map();
function renderPrinterNames(printers) {
  $('printer-name-list').replaceChildren();
  for (const printer of printers) {
    const form = document.createElement('form');
    form.className = 'flex flex-wrap items-center gap-3';
    const label = document.createElement('label');
    label.className = 'flex flex-wrap items-center gap-2 text-sm text-slate-600';
    const input = document.createElement('input');
    input.type = 'text';
    input.required = true;
    input.maxLength = 200;
    input.value = printerNameDrafts.get(printer.id) ?? printer.name;
    input.className = 'w-64 max-w-full rounded-lg border border-slate-300 p-2 text-sm';
    input.addEventListener('input', () => printerNameDrafts.set(printer.id, input.value));
    const serial = document.createElement('span');
    serial.textContent = `(${printer.serial})`;
    input.setAttribute('aria-label', `Nom de l’imprimante ${printer.serial}`);
    label.append(input, serial);
    const button = document.createElement('button');
    button.type = 'submit';
    button.textContent = 'Enregistrer';
    button.className = 'rounded-lg bg-blue-600 px-3 py-2 text-sm text-white disabled:opacity-40';
    form.append(label, button);
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      try {
        await api.patch('/printer-logs/printers/' + encodeURIComponent(printer.id), { name: input.value });
        printerNameDrafts.delete(printer.id);
        await loadFilters();
        showToast('Nom de l’imprimante enregistré', 'success');
      } catch (error) { showToast(error.message, 'error'); }
      finally { button.disabled = false; }
    });
    $('printer-name-list').appendChild(form);
  }
  if (!printers.length) $('printer-name-list').textContent = 'Importez un CSV pour ajouter une imprimante.';
}

async function loadFilters() {
  const data = await api.get('/printer-logs/filters');
  renderPrinterNames(data.printers);
}

requireLogin().then(async user => {
  if (!['ADMIN', 'PRINT_MANAGER'].includes(user.role)) {
    window.location.href = '/printer-logs.html';
    return;
  }
  renderNav('printer-logs');
  $('printer-management-section').classList.remove('hidden');
  await loadFilters();
}).catch(error => showToast(error.message, 'error'));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Carnet de passages – MaintenanceBoard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">

<div class="min-h-screen flex">
  <aside id="sidebar" class="w-64 bg-slate-800 flex flex-col fixed inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
    <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-700">
      <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
      </div>
      <div>
        <p class="text-white font-bold text-sm">MaintenanceBoard</p>
        <p class="text-slate-400 text-xs">Carnet de passages</p>
      </div>
    </div>
    <nav id="main-nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>
    <div class="p-3 border-t border-slate-700">
      <div class="flex items-center gap-3 px-3 py-2">
        <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-xs font-bold">
          <span id="user-avatar">?</span>
        </div>
        <div class="flex-1 min-w-0">
          <p id="user-name" class="text-white text-sm font-medium truncate">...</p>
          <p id="user-role" class="text-slate-400 text-xs"></p>
        </div>
        <button id="logout-btn" class="text-slate-400 hover:text-red-400 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="flex-1 lg:ml-64 flex flex-col">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="lg:hidden p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <div>
          <h1 class="text-xl font-semibold text-slate-800">Carnet de passages</h1>
          <p class="text-sm text-slate-500">Retrouvez les contrôles et observations de chaque salle.</p>
        </div>
      </div>
    </header>

    <div class="p-4 sm:p-6 flex-1 space-y-4">
      <div class="flex flex-wrap gap-3 items-center">
        <select id="room-filter" aria-label="Filtrer par salle" class="border rounded-lg p-2"><option value="">Toutes les salles</option></select>
        <label><input id="damage-filter" type="checkbox"> Dégradations uniquement</label>
        <label><input id="mine-filter" type="checkbox"> Mes passages</label>
        <button id="list-view" class="border rounded-lg px-4 py-2" aria-pressed="true">Liste</button>
        <button id="calendar-view" class="border rounded-lg px-4 py-2" aria-pressed="false">Calendrier</button>
        <button id="add-visit" class="hidden">+ Ajouter un passage</button>
      </div>
      <p class="text-sm text-slate-500">Rouge : dégradations constatées. Orange : contrôle impossible, avec sa raison. Cliquez sur un passage pour le modifier.</p>
      <p id="page-error" role="alert" class="text-red-700"></p>
      <div id="month-nav" class="hidden flex items-center justify-between"><button id="previous-month" class="border rounded-lg p-2" aria-label="Mois précédent">←</button><h2 id="month-title" class="font-semibold"></h2><button id="next-month" class="border rounded-lg p-2" aria-label="Mois suivant">→</button></div>
      <div id="visit-list" class="space-y-3"></div>
      <div id="visit-calendar" class="hidden overflow-x-auto bg-white border rounded-xl"></div>
      <div id="pagination" class="flex gap-4 items-center"><button id="previous-page" class="border rounded-lg p-2">Précédent</button><span id="page-label"></span><button id="next-page" class="border rounded-lg p-2">Suivant</button></div>
    </div>
  </main>
</div>
<dialog id="visit-dialog" class="rounded-2xl p-6 w-full max-w-lg backdrop:bg-slate-900/50">
  <form id="visit-form" class="space-y-4">
    <div class="flex justify-between items-center"><h2 id="dialog-title" class="text-xl font-semibold">Ajouter un passage</h2><button type="button" id="close-dialog" aria-label="Fermer">✕</button></div>
    <label class="block">Salle<select id="visit-room" required class="block w-full border rounded-lg p-2"></select></label>
    <label class="block">Date et heure du passage<input id="visit-date" type="datetime-local" required class="block w-full border rounded-lg p-2"></label>
    <label class="block">Observation<textarea id="visit-observation" rows="5" maxlength="10000" class="block w-full border rounded-lg p-2" placeholder="État de la salle, vérifications effectuées…"></textarea></label>
    <label class="flex gap-2 items-center text-red-700"><input id="visit-damage" type="checkbox"> Dégradations constatées</label>
    <label class="flex gap-2 items-center text-amber-800"><input id="visit-impossible" type="checkbox"> Contrôle impossible</label>
    <label id="impossible-reason-field" class="hidden block">Raison du contrôle impossible<textarea id="visit-impossible-reason" rows="3" maxlength="2000" class="block w-full border rounded-lg p-2" placeholder="Salle occupée, porte verrouillée…"></textarea></label>
    <p id="form-error" role="alert" class="text-red-700"></p>
    <label class="block">Image ou PDF<input id="visit-media" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" class="block w-full border rounded-lg p-2"></label>
    <div id="visit-media-list" class="space-y-1"></div>
    <div class="flex gap-3"><button id="save-visit" type="submit" class="bg-blue-600 text-white rounded-lg px-4 py-2">Enregistrer</button><button id="delete-visit" type="button" class="hidden text-red-700 border rounded-lg px-4 py-2">Supprimer</button></div>
  </form>
</dialog>
<button id="visit-fab" type="button" aria-label="Ajouter un contrôle" class="fixed right-6 bottom-6 z-30 h-14 w-14 rounded-full bg-blue-600 text-3xl text-white shadow-xl hover:bg-blue-700">+</button>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/room-visits.js"></script>
</body>
</html>

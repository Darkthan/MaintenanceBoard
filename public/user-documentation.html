<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Documentation utilisateurs – MaintenanceBoard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <div class="min-h-screen flex">
    <aside id="sidebar" class="w-64 bg-slate-800 flex flex-col fixed inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
      <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-700"></div><nav id="main-nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>
      <div class="p-3 border-t border-slate-700"><div class="flex items-center gap-3 px-3 py-2"><div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-xs font-bold"><span id="user-avatar">?</span></div><div class="flex-1 min-w-0"><p id="user-name" class="text-white text-sm font-medium truncate">...</p><p id="user-role" class="text-slate-400 text-xs"></p></div><button id="logout-btn" class="text-slate-400 hover:text-red-400" aria-label="Se déconnecter">↪</button></div></div>
    </aside>
    <main class="flex-1 lg:ml-64 min-w-0">
      <header class="bg-white border-b border-slate-200 px-4 py-4 sm:px-6 flex items-center justify-between gap-3"><div><p class="text-xs font-semibold uppercase tracking-wider text-blue-600">Documentation</p><h1 class="text-xl font-semibold text-slate-800">Documentation utilisateurs</h1><p class="text-sm text-slate-500">Guides simples et procédures de résolution pour les demandeurs.</p></div><button id="new-article" class="hidden rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">Nouvel article</button></header>
      <section class="p-4 sm:p-6 max-w-6xl mx-auto"><div class="mb-5"><input id="search" type="search" class="w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="Rechercher une procédure utilisateur…" /></div><p id="empty" class="hidden rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center text-slate-500">Aucune documentation utilisateur.</p><div id="articles" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div></section>
    </main>
  </div>
  <div id="editor" class="hidden fixed inset-0 z-50 bg-slate-950/50 p-4 overflow-y-auto"><form class="mx-auto mt-4 max-w-2xl rounded-2xl bg-white p-6 shadow-xl space-y-4"><div class="flex justify-between gap-4"><h2 id="editor-title" class="text-lg font-semibold">Nouvel article</h2><button type="button" id="cancel" class="text-slate-500">Fermer</button></div><label class="block text-sm font-medium">Titre *<input id="title" required maxlength="200" class="mt-1 w-full rounded-lg border p-2" /></label><label class="block text-sm font-medium">Résumé<input id="summary" maxlength="500" class="mt-1 w-full rounded-lg border p-2" /></label><div class="grid sm:grid-cols-2 gap-3"><label class="block text-sm font-medium">Catégorie<input id="category" maxlength="100" class="mt-1 w-full rounded-lg border p-2" /></label><label class="block text-sm font-medium">Mots-clés<input id="tags" class="mt-1 w-full rounded-lg border p-2" placeholder="projecteur, affichage" /></label></div><label class="block text-sm font-medium">Procédure *<textarea id="content" required rows="10" maxlength="20000" class="mt-1 w-full rounded-lg border p-2" placeholder="Décrivez les étapes à suivre, avec des termes simples."></textarea></label><label class="flex items-start gap-3 rounded-xl border border-blue-100 bg-blue-50 p-3 text-sm"><input id="show-in-reports" type="checkbox" class="mt-1" /><span><strong>Proposer pendant un signalement</strong><br><span class="text-slate-600">Cet article pourra être suggéré au demandeur quand son problème est similaire. Les articles non cochés restent accessibles uniquement dans cette page connectée.</span></span></label><p id="form-error" class="hidden text-sm text-red-600"></p><div class="flex justify-between gap-3"><button id="delete" type="button" class="hidden text-sm text-red-600">Supprimer</button><button class="ml-auto rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white">Enregistrer</button></div></form></div>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script>
  <script>
    let currentUser, selectedId = '', articles = [];
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value || '').replace(/[&<>'"]/g, char => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[char]));
    async function load() { const data = await api.get('/user-documentation', { q: $('search').value.trim() }); articles = data.items; render(); }
    function render() { $('articles').replaceChildren(); $('empty').classList.toggle('hidden', articles.length !== 0); articles.forEach(article => { const card = document.createElement('button'); card.type = 'button'; card.className = 'text-left rounded-2xl border bg-white p-5 shadow-sm hover:border-blue-300'; card.innerHTML = `<p class="text-xs font-medium text-blue-600">${escapeHtml(article.category || 'Guide utilisateur')}</p><h2 class="mt-1 text-base font-semibold text-slate-800">${escapeHtml(article.title)}</h2><p class="mt-2 text-sm leading-6 text-slate-500">${escapeHtml(article.summary || article.excerpt)}</p>${article.showInReports ? '<span class="mt-3 inline-block rounded-full bg-blue-100 px-2 py-1 text-xs text-blue-700">Suggéré lors des demandes</span>' : ''}`; card.onclick = () => open(article.id); $('articles').appendChild(card); }); }
    async function open(id) { const article = await api.get(`/user-documentation/${id}`); selectedId = id; $('editor-title').textContent = 'Modifier l’article'; $('title').value = article.title; $('summary').value = article.summary; $('category').value = article.category; $('tags').value = article.tags.join(', '); $('content').value = article.content; $('show-in-reports').checked = article.showInReports; $('delete').classList.toggle('hidden', currentUser.role !== 'ADMIN'); $('editor').classList.remove('hidden'); }
    function newArticle() { selectedId = ''; $('editor-title').textContent = 'Nouvel article'; $('editor').querySelector('form').reset(); $('delete').classList.add('hidden'); $('editor').classList.remove('hidden'); }
    $('new-article').onclick = newArticle; $('cancel').onclick = () => $('editor').classList.add('hidden'); $('search').addEventListener('input', (() => { let timer; return () => { clearTimeout(timer); timer = setTimeout(load, 250); }; })());
    $('editor').querySelector('form').onsubmit = async event => { event.preventDefault(); $('form-error').classList.add('hidden'); const body = { title: $('title').value, summary: $('summary').value, category: $('category').value, tags: $('tags').value, content: $('content').value, showInReports: $('show-in-reports').checked }; try { if (selectedId) await api.patch(`/user-documentation/${selectedId}`, body); else await api.post('/user-documentation', body); $('editor').classList.add('hidden'); await load(); } catch (error) { $('form-error').textContent = error.message; $('form-error').classList.remove('hidden'); } };
    $('delete').onclick = async () => { if (!selectedId || !confirm('Supprimer cet article ?')) return; await api.delete(`/user-documentation/${selectedId}`); $('editor').classList.add('hidden'); await load(); };
    (async () => { currentUser = await requireLogin(); renderNav('user-documentation'); $('new-article').classList.toggle('hidden', currentUser.role !== 'ADMIN'); await load(); })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Graphiques des impressions – MaintenanceBoard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
<div id="layout-root"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
document.getElementById('layout-root').innerHTML = getLayoutTemplate('Graphiques des impressions', 'printer-charts') + `
<div class="space-y-5">
  <section class="rounded-xl border border-slate-200 bg-white p-5">
    <h2 class="font-semibold text-slate-800">Évolution des impressions</h2>
    <p class="mt-1 text-sm text-slate-500">Copies et impressions, en faces imprimées. Le recto verso est déjà inclus dans le compteur RISO. Grayscale est compté en noir et blanc.</p>
    <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        <div class="text-xs font-medium text-slate-600"><span>Imprimantes</span><details id="printer-filter" class="relative mt-1"><summary id="printer-selection" class="cursor-pointer truncate rounded-lg border border-slate-300 bg-white p-2 text-sm">Toutes</summary><div class="absolute left-0 top-full z-20 mt-1 w-72 max-w-[80vw] rounded-lg border border-slate-200 bg-white p-3 shadow-lg"><button id="clear-printers" type="button" class="mb-2 text-blue-700 hover:underline">Toutes les imprimantes</button><input id="printer-search" type="search" aria-label="Rechercher une imprimante" placeholder="Rechercher…" class="mb-2 w-full rounded border border-slate-300 p-2 text-sm" /><div id="printer-options" class="max-h-60 overflow-y-auto space-y-1"></div></div></details></div>
        <div class="text-xs font-medium text-slate-600"><span>Utilisateurs</span><details id="owner-filter" class="relative mt-1"><summary id="owner-selection" class="cursor-pointer truncate rounded-lg border border-slate-300 bg-white p-2 text-sm">Tous</summary><div class="absolute left-0 top-full z-20 mt-1 w-72 max-w-[80vw] rounded-lg border border-slate-200 bg-white p-3 shadow-lg"><button id="clear-owners" type="button" class="mb-2 text-blue-700 hover:underline">Tous les utilisateurs</button><input id="owner-search" type="search" aria-label="Rechercher un utilisateur" placeholder="Rechercher…" class="mb-2 w-full rounded border border-slate-300 p-2 text-sm" /><div id="owner-options" class="max-h-60 overflow-y-auto space-y-1"></div></div></details></div>

      <label class="text-xs font-medium text-slate-600">Vue<select id="interval-filter" class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2 text-sm"><option value="month">Mois par mois</option><option value="day">Jour par jour</option></select></label>
      <label class="text-xs font-medium text-slate-600">Type<select id="kind-filter" class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2 text-sm"><option value="">Copies et impressions</option><option value="Print">Impressions</option><option value="Copy">Copies</option></select></label>
      <label class="text-xs font-medium text-slate-600">Du<input id="from-filter" type="date" class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm" /></label>
      <label class="text-xs font-medium text-slate-600">Au<input id="to-filter" type="date" class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm" /></label>
    </div>
  </section>
  <section class="rounded-xl border border-slate-200 bg-white p-5">
    <div class="flex flex-wrap items-center justify-between gap-3"><h2 id="chart-title" class="font-semibold text-slate-800">Faces imprimées par mois</h2><p class="text-sm text-slate-600">Total : <strong id="chart-total">0</strong> faces</p></div>
    <div class="mt-3 flex flex-wrap gap-4 text-sm text-slate-600"><span>● <span class="text-slate-700">Noir et blanc</span></span><span class="text-blue-600">● Couleur</span><span class="text-amber-600">● Auto / autre</span></div>
    <p id="chart-status" role="status" class="mt-3 text-sm text-slate-500"></p>
    <div class="mt-3 grid min-w-0 grid-cols-[64px_minmax(0,1fr)]">
      <div id="chart-axis" aria-hidden="true"></div>
      <div id="chart" class="min-w-0 overflow-x-auto" tabindex="0" aria-label="Graphique des faces imprimées, défilement horizontal"></div>
    </div>
    <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
      <button id="chart-left" type="button" aria-label="Afficher les périodes précédentes" class="rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700 disabled:opacity-40">← Précédent</button>
      <span id="chart-range" class="text-sm text-slate-500" role="status"></span>
      <button id="chart-right" type="button" aria-label="Afficher les périodes suivantes" class="rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700 disabled:opacity-40">Suivant →</button>
    </div>
  </section>
  <section class="overflow-hidden rounded-xl border border-slate-200 bg-white">
    <h2 class="border-b border-slate-200 p-5 font-semibold text-slate-800">Détail par période</h2>
    <div class="overflow-x-auto"><table class="w-full text-right text-sm"><thead class="bg-slate-50 text-slate-600"><tr><th class="p-3 text-left">Période</th><th class="p-3">Noir et blanc</th><th class="p-3">Couleur</th><th class="p-3">Auto / autre</th><th class="p-3">Total faces</th></tr></thead><tbody id="period-rows" class="divide-y divide-slate-100"></tbody></table></div>
  </section>
</div>`;
</script>
<script src="/js/printer-charts.js"></script>
</body>
</html>

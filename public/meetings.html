<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Réunions - MaintenanceBoard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    main, #page-content, .meeting-grid > * { min-width: 0; }
    .meeting-grid { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 1.5rem; }
    .meeting-card { background: white; border: 1px solid #e2e8f0; border-radius: .75rem; padding: 1rem; overflow-wrap: anywhere; }
    .meeting-editor label { display: block; margin: .75rem 0; }
    .meeting-editor input:not([type=checkbox]), .meeting-editor textarea, .meeting-editor select { display: block; width: 100%; min-width: 0; border: 1px solid #cbd5e1; border-radius: .4rem; padding: .6rem; font-size: 16px; margin-top: .25rem; }
    .meeting-editor textarea { min-height: 7rem; resize: vertical; }
    .meeting-editor button, .meeting-controls button { border: 1px solid #cbd5e1; border-radius: .4rem; padding: .5rem .75rem; }
    button:disabled { opacity: .5; }
    .meeting-preview { display: block; background: #f1f5f9; border-radius: .4rem; padding: .75rem; color: #1d4ed8; margin: .5rem 0; }
    .meeting-mentions { border: 1px solid #93c5fd; background: #eff6ff; padding: .75rem; border-radius: .5rem; margin: .5rem 0; max-height: 22rem; overflow: auto; }
    .meeting-mentions p { margin-bottom: .5rem; }
    .meeting-mentions button { margin: .25rem; text-align: left; }
    .meeting-mentions .meeting-mention-result { display: block; width: calc(100% - .5rem); background: white; overflow-wrap: anywhere; }
    .meeting-mentions button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    #page-content { background: #f5f7fc; }
    .meetings-intro { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.25rem; }
    .meetings-intro h2 { font-size:clamp(1.5rem,3vw,2rem); font-weight:750; letter-spacing:-.04em; color:#0f172a; margin:.3rem 0; }
    .meetings-intro p,.meeting-subtitle { color:#64748b; font-size:.9rem; }
    .meeting-eyebrow { font-size:.7rem; text-transform:uppercase; letter-spacing:.14em; font-weight:700; color:#4f46e5; }
    .meeting-primary { background:#4f46e5 !important; color:white; border-color:#4f46e5 !important; box-shadow:0 3px 8px #4f46e51a; padding:.7rem 1rem; border-radius:.65rem; font-weight:600; }
    .meeting-primary:hover { background:#4338ca !important; }
    .meeting-feedback { min-height:1.5rem; margin-bottom:1rem; font-size:.85rem; color:#4338ca; }
    .meeting-grid { grid-template-columns:minmax(200px,250px) minmax(0,1fr); align-items:start; }
    .meeting-history-panel { background:#fff; padding:1rem; border:1px solid #e4e8f2; border-radius:1rem; }
    .meeting-history-panel > label { font-size:.8rem; color:#64748b; }
    .meeting-history-panel > summary { font-size:1rem; font-weight:650; color:#334155; cursor:pointer; }
    .meeting-history-body { margin-top:1rem; }
    .meeting-history-body > label { font-size:.8rem; color:#64748b; }
    #meeting-history { margin-top:1rem; }
    #meeting-history .meeting-card { border-color:#eef0f6; padding:.85rem; border-radius:.65rem; transition:background .15s,border-color .15s; }
    #meeting-history .meeting-card:hover { background:#f5f3ff; border-color:#c7d2fe; }
    .meeting-card { border-color:#e4e8f2; border-radius:1rem; box-shadow:0 2px 5px #0f172a03; }
    .meeting-heading { padding:1.5rem; background:linear-gradient(125deg,#fff 60%,#f1f0ff); }
    .meeting-heading h2 { font-size:1.45rem; letter-spacing:-.03em; margin:.4rem 0; }
    .meeting-heading-top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.5rem; }
    .meeting-status-pill { padding:.25rem .55rem; border-radius:1rem; color:#4f46e5; background:#e9e7ff; font-size:.7rem; font-weight:600; }
    .meeting-metadata { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr); gap:1rem; margin-top:.75rem; }
    .meeting-settings { margin-top:1rem; }
    .meeting-settings > summary { font-size:.75rem; color:#64748b; cursor:pointer; }
    .meeting-editor label { font-size:.8rem; font-weight:600; color:#475569; }
    .meeting-editor input:not([type=checkbox]),.meeting-editor textarea,.meeting-editor select { font-weight:400; color:#0f172a; background:#fff; border-color:#dce2ed; border-radius:.6rem; }
    .meeting-editor input:focus,.meeting-editor textarea:focus,.meeting-editor select:focus { outline:2px solid #c7d2fe; border-color:#818cf8; }
    .meeting-progress { display:flex; justify-content:space-between; gap:.5rem; color:#64748b; font-size:.75rem; margin:1rem 0 .5rem; }
    .meeting-progress span:first-child { color:#4f46e5; font-weight:600; }
    .meeting-heading progress { appearance:none; display:block; width:100%; height:5px; border:none; border-radius:4px; overflow:hidden; }
    .meeting-heading progress::-webkit-progress-bar { background:#e8eaf4; }
    .meeting-heading progress::-webkit-progress-value { background:#6366f1; border-radius:4px; }
    .meeting-heading progress::-moz-progress-bar { background:#6366f1; }
    .agenda-toolbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin:1.5rem 0 1rem; }
    .agenda-toolbar h3 { font-size:1rem; font-weight:700; color:#0f172a; }
    .agenda-toolbar p { font-size:.75rem; color:#64748b; margin-top:.25rem; }
    .agenda-view-actions { display:flex; gap:.4rem; flex-shrink:0; }
    .agenda-view-actions button { font-size:.75rem; background:white; }
    .agenda-list { display:grid; gap:.65rem; }
    .topic-card { padding:0; transition:border-color .15s; }
    .topic-card[open] { border-color:#a5b4fc; box-shadow:0 4px 18px #4f46e509; }
    .topic-card summary { display:flex; align-items:center; gap:.75rem; cursor:pointer; padding:1rem; list-style:none; border-radius:1rem; }
    .topic-card summary::-webkit-details-marker { display:none; }
    .topic-card summary:hover { background:#fafaff; }
    .topic-card summary:focus-visible { outline:2px solid #818cf8; outline-offset:2px; }
    .topic-card input[type=checkbox] { width:1.1rem; height:1.1rem; flex-shrink:0; accent-color:#6366f1; cursor:pointer; }
    .topic-number { color:#94a3b8; font-size:.75rem; font-variant-numeric:tabular-nums; }
    .topic-summary-content { display:grid; gap:.25rem; flex:1; min-width:0; }
    .topic-summary-content strong { font-size:.9rem; font-weight:600; color:#1e293b; overflow-wrap:anywhere; }
    .topic-meta { display:flex; flex-wrap:wrap; gap:.25rem .75rem; color:#94a3b8; font-size:.7rem; }
    .topic-meta span:first-child { color:#6366f1; }
    .topic-done .topic-meta span:first-child { color:#059669; }
    .topic-done .topic-summary-content strong { color:#64748b; }
    .topic-chevron { color:#94a3b8; transition:transform .2s; }
    .topic-card[open] .topic-chevron { transform:rotate(180deg); }
    .topic-body { padding:.25rem 1.25rem 1.25rem; border-top:1px solid #eef0f6; }
    .topic-body button { background:#fff; font-size:.8rem; }
    .meeting-savebar { display:flex; justify-content:space-between; flex-wrap:wrap; gap:.75rem; margin-top:1rem; padding:1rem; background:#fff; border:1px solid #e4e8f2; border-radius:1rem; }
    .meeting-savebar button { font-size:.85rem; }
    .agenda-empty { padding:2rem; text-align:center; border:1px dashed #cbd5e1; border-radius:1rem; color:#64748b; }
    .agenda-empty > span { font-size:2rem; color:#818cf8; }
    .agenda-empty h4 { color:#334155; font-weight:600; margin:.5rem 0; }
    .agenda-empty p { font-size:.85rem; }
    @media (max-width:1100px) { .meeting-metadata { grid-template-columns:1fr; gap:0; } }
    @media (max-width:900px) { .meetings-intro,.agenda-toolbar { align-items:flex-start; flex-direction:column; } .meeting-heading { padding:1rem; } .meeting-history-panel { max-height:20rem; overflow:auto; } }
    @media (max-width:767px) { .meetings-intro.meeting-open > div { display:none; } .meeting-open .meeting-primary { font-size:.8rem; padding:.6rem .8rem; } .meeting-subtitle { display:none; } .agenda-toolbar { margin-top:1rem; gap:.5rem; } .topic-meta { gap:.2rem .5rem; } .topic-card summary { gap:.5rem; padding:.85rem; } }
    @media (max-width: 900px) { .meeting-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="bg-slate-50">
  <div id="app"></div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/meeting-mentions.js"></script>
  <script src="/js/meetings.js"></script>
</body>
</html>

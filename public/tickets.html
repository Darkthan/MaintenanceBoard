<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Tickets – MaintenanceBoard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .ticket-card { transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
    .ticket-card:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(15, 23, 42, .07); }
    @media (max-width: 767px) {
      .ticket-actions select, .ticket-actions a { width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-50">
<div class="min-h-screen flex">
  <aside id="sidebar" class="w-64 bg-slate-800 flex flex-col fixed inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
    <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-700">
      <div class="w-9 h-9 bg-amber-500 rounded-xl flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2m-8 0h8m-8 0H5a2 2 0 00-2 2v3a2 2 0 010 4v3a2 2 0 002 2h3m8-12h3a2 2 0 012 2v3a2 2 0 000 4v3a2 2 0 01-2 2h-3M8 7v14m8-14v14"/></svg>
      </div>
      <div><p class="text-white font-bold text-sm">MaintenanceBoard</p><p class="text-slate-400 text-xs">Gestion des tickets</p></div>
    </div>
    <nav id="main-nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>
    <div class="p-3 border-t border-slate-700">
      <div class="flex items-center gap-3 px-3 py-2">
        <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-xs font-bold"><span id="user-avatar">?</span></div>
        <div class="flex-1 min-w-0"><p id="user-name" class="text-white text-sm font-medium truncate">...</p><p id="user-role" class="text-slate-400 text-xs"></p></div>
        <button id="logout-btn" class="text-slate-400 hover:text-red-400 transition" aria-label="Se déconnecter">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="flex-1 lg:ml-64 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 px-4 py-4 sm:px-6 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-3 min-w-0">
        <button onclick="toggleSidebar()" class="lg:hidden p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="min-w-0">
          <h1 class="text-xl font-semibold text-slate-800">Gestion des tickets</h1>
          <p class="text-xs text-slate-400 mt-0.5">Demandes envoyées par les utilisateurs</p>
        </div>
      </div>
      <a href="/report.html" class="hidden sm:inline-flex items-center gap-2 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-sm font-medium text-amber-700 hover:bg-amber-100 transition">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Formulaire public
      </a>
    </header>

    <div class="flex-1 p-4 sm:p-6 space-y-5">
      <section class="grid grid-cols-2 gap-3 xl:grid-cols-4">
        <button type="button" data-summary-filter="OPEN" class="rounded-2xl border border-slate-200 bg-white p-4 text-left hover:border-blue-300 transition">
          <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Nouveaux</p>
          <p id="summary-open" class="mt-2 text-3xl font-bold text-blue-600">—</p>
        </button>
        <button type="button" data-summary-filter="IN_PROGRESS" class="rounded-2xl border border-slate-200 bg-white p-4 text-left hover:border-amber-300 transition">
          <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">En cours</p>
          <p id="summary-progress" class="mt-2 text-3xl font-bold text-amber-600">—</p>
        </button>
        <button type="button" data-summary-filter="unread" class="rounded-2xl border border-slate-200 bg-white p-4 text-left hover:border-orange-300 transition">
          <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Messages non lus</p>
          <p id="summary-unread" class="mt-2 text-3xl font-bold text-orange-600">—</p>
        </button>
        <button id="summary-unassigned-card" type="button" data-summary-filter="unassigned" class="rounded-2xl border border-slate-200 bg-white p-4 text-left hover:border-violet-300 transition">
          <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Non attribués</p>
          <p id="summary-unassigned" class="mt-2 text-3xl font-bold text-violet-600">—</p>
        </button>
      </section>

      <section data-mobile-filters="true" class="rounded-2xl border border-slate-200 bg-white p-4 flex flex-wrap gap-3">
        <input id="search-input" type="search" placeholder="Titre, description…" class="min-w-56 flex-1 rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <select id="status-filter" class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm">
          <option value="">Tous les états</option>
          <option value="OPEN">Ouverts</option>
          <option value="IN_PROGRESS">En cours</option>
          <option value="RESOLVED">Résolus</option>
          <option value="CLOSED">Fermés</option>
        </select>
        <select id="priority-filter" class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm">
          <option value="">Toutes les priorités</option>
          <option value="CRITICAL">Critique</option>
          <option value="HIGH">Haute</option>
          <option value="NORMAL">Normale</option>
          <option value="LOW">Basse</option>
        </select>
        <select id="tech-filter" class="hidden rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm">
          <option value="">Tous les techniciens</option>
          <option value="unassigned">Non attribués</option>
        </select>
        <label class="inline-flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2 text-sm text-slate-600">
          <input id="archived-filter" type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
          Archivés
        </label>
        <button id="reset-filters" type="button" class="rounded-xl border border-slate-300 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">Réinitialiser</button>
      </section>

      <div class="flex items-center justify-between gap-3">
        <p id="result-count" class="text-sm text-slate-500">Chargement…</p>
        <button id="refresh-btn" type="button" class="inline-flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Actualiser
        </button>
      </div>

      <section id="tickets-loading" class="rounded-2xl border border-slate-200 bg-white p-10 text-center text-sm text-slate-400">Chargement des tickets…</section>
      <section id="tickets-error" class="hidden rounded-2xl border border-red-200 bg-red-50 p-6 text-center text-sm text-red-700"></section>
      <section id="tickets-empty" class="hidden rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center">
        <svg class="mx-auto h-10 w-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2m-8 0h8m-8 0H5a2 2 0 00-2 2v3a2 2 0 010 4v3a2 2 0 002 2h3m8-12h3a2 2 0 012 2v3a2 2 0 000 4v3a2 2 0 01-2 2h-3M8 7v14m8-14v14"/></svg>
        <p class="mt-3 font-medium text-slate-700">Aucun ticket trouvé</p>
        <p class="mt-1 text-sm text-slate-400">Modifiez les filtres ou actualisez la liste.</p>
      </section>
      <section id="tickets-list" class="hidden space-y-3"></section>

      <div id="pagination" class="flex items-center justify-between gap-3 text-sm text-slate-500"></div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const STATUS_LABELS = { OPEN: 'Ouvert', IN_PROGRESS: 'En cours', RESOLVED: 'Résolu', CLOSED: 'Fermé' };
const STATUS_CLASSES = {
  OPEN: 'bg-blue-100 text-blue-700',
  IN_PROGRESS: 'bg-amber-100 text-amber-700',
  RESOLVED: 'bg-emerald-100 text-emerald-700',
  CLOSED: 'bg-slate-200 text-slate-600'
};
const PRIORITY_LABELS = { LOW: 'Basse', NORMAL: 'Normale', HIGH: 'Haute', CRITICAL: 'Critique' };
const PRIORITY_CLASSES = {
  LOW: 'bg-slate-100 text-slate-600', NORMAL: 'bg-blue-50 text-blue-700',
  HIGH: 'bg-orange-100 text-orange-700', CRITICAL: 'bg-red-100 text-red-700'
};

let user = null;
let technicians = [];
let currentPage = 1;
let totalPages = 1;
let searchTimer = null;
let unreadOnly = false;

const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
const formatDate = value => value ? new Date(value).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';

function primaryReporter(ticket) {
  return ticket.reporters?.find(item => item.isPrimary) || ticket.reporters?.[0] || {
    name: ticket.reporterName,
    email: ticket.reporterEmail
  };
}

function locationLabel(ticket) {
  if (ticket.equipment) return `${ticket.equipment.name}${ticket.room?.name ? ` · ${ticket.room.name}` : ''}`;
  if (ticket.room) return ticket.room.name;
  return ticket.suggestedEquipment || ticket.suggestedRoom || 'Emplacement non précisé';
}

function technicianOptions(selectedId) {
  return `<option value="">Non attribué</option>` + technicians.map(tech =>
    `<option value="${escapeHtml(tech.id)}" ${tech.id === selectedId ? 'selected' : ''}>${escapeHtml(tech.name)}</option>`
  ).join('');
}

function renderTicket(ticket) {
  const reporter = primaryReporter(ticket);
  const lastMessage = ticket.messages?.[0];
  const unreadCount = Number(ticket._count?.messages || 0);
  const needsReply = unreadCount > 0 || lastMessage?.authorType === 'REPORTER';
  const description = String(ticket.description || '').trim();
  const techName = ticket.tech?.name || 'Non attribué';

  return `
    <article class="ticket-card rounded-2xl border ${needsReply ? 'border-orange-200 bg-orange-50/30' : 'border-slate-200 bg-white'} p-4 sm:p-5" data-ticket-id="${escapeHtml(ticket.id)}">
      <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-2">
            <span class="rounded-full px-2.5 py-1 text-xs font-semibold ${STATUS_CLASSES[ticket.status] || 'bg-slate-100 text-slate-600'}">${escapeHtml(STATUS_LABELS[ticket.status] || ticket.status)}</span>
            <span class="rounded-full px-2.5 py-1 text-xs font-semibold ${PRIORITY_CLASSES[ticket.priority] || 'bg-slate-100 text-slate-600'}">${escapeHtml(PRIORITY_LABELS[ticket.priority] || ticket.priority)}</span>
            ${needsReply ? `<span class="rounded-full bg-orange-500 px-2.5 py-1 text-xs font-semibold text-white">${unreadCount ? `${unreadCount} message${unreadCount > 1 ? 's' : ''} à lire` : 'Réponse attendue'}</span>` : ''}
          </div>
          <h2 class="mt-3 text-base font-semibold text-slate-900 break-words">${escapeHtml(ticket.title)}</h2>
          ${description ? `<p class="mt-1 text-sm text-slate-600 line-clamp-2 whitespace-pre-wrap">${escapeHtml(description)}</p>` : ''}
          <div class="mt-3 grid gap-2 text-xs text-slate-500 sm:grid-cols-2 xl:grid-cols-4">
            <p><span class="font-semibold text-slate-600">Demandeur :</span> ${escapeHtml(reporter.name || 'Non renseigné')}</p>
            <p class="truncate" title="${escapeHtml(reporter.email || '')}"><span class="font-semibold text-slate-600">Email :</span> ${escapeHtml(reporter.email || '—')}</p>
            <p><span class="font-semibold text-slate-600">Lieu :</span> ${escapeHtml(locationLabel(ticket))}</p>
            <p><span class="font-semibold text-slate-600">Créé :</span> ${escapeHtml(formatDate(ticket.createdAt))}</p>
          </div>
          <div class="mt-3 rounded-xl bg-slate-50 px-3 py-2 text-xs text-slate-500">
            <span class="font-semibold text-slate-600">Dernier échange :</span>
            ${lastMessage ? `${lastMessage.authorType === 'REPORTER' ? 'Demandeur' : 'Équipe'} · ${escapeHtml(lastMessage.content || lastMessage.attachmentName || 'Pièce jointe')} · ${escapeHtml(formatDate(lastMessage.createdAt))}` : 'aucun message'}
          </div>
        </div>

        <div class="ticket-actions grid w-full gap-2 sm:grid-cols-2 xl:w-80 xl:grid-cols-1">
          <label class="text-xs font-medium text-slate-500">État
            <select data-action="status" class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm">
              ${Object.entries(STATUS_LABELS).map(([value, label]) => `<option value="${value}" ${ticket.status === value ? 'selected' : ''}>${label}</option>`).join('')}
            </select>
          </label>
          <label class="text-xs font-medium text-slate-500">Priorité
            <select data-action="priority" class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm">
              ${Object.entries(PRIORITY_LABELS).map(([value, label]) => `<option value="${value}" ${ticket.priority === value ? 'selected' : ''}>${label}</option>`).join('')}
            </select>
          </label>
          ${user.role === 'ADMIN' ? `
            <label class="text-xs font-medium text-slate-500 sm:col-span-2 xl:col-span-1">Technicien
              <select data-action="assignment" class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm">${technicianOptions(ticket.techId)}</select>
            </label>` : `<p class="text-xs text-slate-500 sm:col-span-2 xl:col-span-1">Attribué à <span class="font-semibold text-slate-700">${escapeHtml(techName)}</span></p>`}
          <a href="/messages-ticket.html?id=${encodeURIComponent(ticket.id)}" class="inline-flex items-center justify-center gap-2 rounded-xl bg-amber-500 px-3 py-2 text-sm font-medium text-white hover:bg-amber-600 transition">
            Répondre
          </a>
          <a href="/interventions.html?id=${encodeURIComponent(ticket.id)}" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 transition">
            Fiche complète
          </a>
        </div>
      </div>
    </article>`;
}

function bindTicketActions() {
  document.querySelectorAll('[data-ticket-id]').forEach(card => {
    const id = card.dataset.ticketId;
    card.querySelector('[data-action="status"]')?.addEventListener('change', event => updateTicket(id, { status: event.target.value }));
    card.querySelector('[data-action="priority"]')?.addEventListener('change', event => updateTicket(id, { priority: event.target.value }));
    card.querySelector('[data-action="assignment"]')?.addEventListener('change', event => assignTicket(id, event.target.value || null));
  });
}

function currentFilters() {
  const techValue = document.getElementById('tech-filter').value;
  return {
    page: currentPage,
    limit: 20,
    source: 'PUBLIC',
    search: document.getElementById('search-input').value.trim(),
    status: document.getElementById('status-filter').value,
    priority: document.getElementById('priority-filter').value,
    archived: document.getElementById('archived-filter').checked ? 'true' : undefined,
    techId: techValue && techValue !== 'unassigned' ? techValue : undefined,
    unassigned: techValue === 'unassigned' ? 'true' : undefined,
    needsReply: unreadOnly ? 'true' : undefined
  };
}

async function loadSummary() {
  const summary = await api.get('/interventions/tickets/summary');
  document.getElementById('summary-open').textContent = summary.open || 0;
  document.getElementById('summary-progress').textContent = summary.inProgress || 0;
  document.getElementById('summary-unread').textContent = summary.unread || 0;
  document.getElementById('summary-unassigned').textContent = summary.unassigned || 0;
}

async function loadTickets() {
  const loading = document.getElementById('tickets-loading');
  const error = document.getElementById('tickets-error');
  const empty = document.getElementById('tickets-empty');
  const list = document.getElementById('tickets-list');
  loading.classList.remove('hidden');
  error.classList.add('hidden');
  empty.classList.add('hidden');
  list.classList.add('hidden');

  try {
    const result = await api.get('/interventions', currentFilters());
    const tickets = result.data || [];
    totalPages = Math.max(1, result.pagination?.totalPages || 1);
    document.getElementById('result-count').textContent = unreadOnly
      ? `${result.pagination?.total || 0} ticket(s) avec message non lu`
      : `${result.pagination?.total || 0} ticket(s)`;
    loading.classList.add('hidden');

    if (!tickets.length) {
      empty.classList.remove('hidden');
    } else {
      list.innerHTML = tickets.map(renderTicket).join('');
      list.classList.remove('hidden');
      bindTicketActions();
    }
    renderPagination(result.pagination || {});
    syncUrl();
  } catch (err) {
    loading.classList.add('hidden');
    error.textContent = err.message || 'Impossible de charger les tickets.';
    error.classList.remove('hidden');
  }
}

function renderPagination(pagination) {
  const page = pagination.page || currentPage;
  const total = pagination.total || 0;
  const container = document.getElementById('pagination');
  if ((pagination.totalPages || 0) <= 1) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = `
    <span>Page ${page} sur ${pagination.totalPages} · ${total} résultat(s)</span>
    <div class="flex items-center gap-2">
      <button id="previous-page" type="button" ${page <= 1 ? 'disabled' : ''} class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm disabled:opacity-40">Précédent</button>
      <button id="next-page" type="button" ${page >= pagination.totalPages ? 'disabled' : ''} class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm disabled:opacity-40">Suivant</button>
    </div>`;
  document.getElementById('previous-page')?.addEventListener('click', () => changePage(page - 1));
  document.getElementById('next-page')?.addEventListener('click', () => changePage(page + 1));
}

function changePage(page) {
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  loadTickets();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function updateTicket(id, patch) {
  try {
    await api.patch(`/interventions/${id}`, patch);
    showToast('Ticket mis à jour', 'success');
    await Promise.all([loadTickets(), loadSummary()]);
  } catch (err) {
    showToast(err.message || 'Mise à jour impossible', 'error');
    await loadTickets();
  }
}

async function assignTicket(id, techId) {
  try {
    await api.patch(`/interventions/${id}/assignment`, { techId });
    showToast(techId ? 'Ticket attribué' : 'Attribution retirée', 'success');
    await Promise.all([loadTickets(), loadSummary()]);
  } catch (err) {
    showToast(err.message || 'Attribution impossible', 'error');
    await loadTickets();
  }
}

async function loadTechnicians() {
  if (user.role !== 'ADMIN') return;
  const users = await api.get('/users');
  technicians = users.filter(item => item.isActive && ['ADMIN', 'TECH'].includes(item.role));
  const filter = document.getElementById('tech-filter');
  filter.innerHTML = '<option value="">Tous les techniciens</option><option value="unassigned">Non attribués</option>' +
    technicians.map(tech => `<option value="${escapeHtml(tech.id)}">${escapeHtml(tech.name)}</option>`).join('');
  filter.classList.remove('hidden');
}

function resetFilters(reload = true) {
  document.getElementById('search-input').value = '';
  document.getElementById('status-filter').value = '';
  document.getElementById('priority-filter').value = '';
  document.getElementById('tech-filter').value = '';
  document.getElementById('archived-filter').checked = false;
  unreadOnly = false;
  currentPage = 1;
  if (reload) loadTickets();
}

function syncUrl() {
  const filters = currentFilters();
  const params = new URLSearchParams();
  ['page', 'search', 'status', 'priority', 'techId', 'unassigned', 'needsReply', 'archived'].forEach(key => {
    if (filters[key] && !(key === 'page' && filters[key] === 1)) params.set(key, filters[key]);
  });
  history.replaceState(null, '', `${location.pathname}${params.toString() ? `?${params}` : ''}`);
}

function restoreFilters() {
  const params = new URLSearchParams(location.search);
  currentPage = Math.max(1, Number(params.get('page')) || 1);
  document.getElementById('search-input').value = params.get('search') || '';
  document.getElementById('status-filter').value = params.get('status') || '';
  document.getElementById('priority-filter').value = params.get('priority') || '';
  document.getElementById('archived-filter').checked = params.get('archived') === 'true';
  unreadOnly = params.get('needsReply') === 'true';
  const tech = params.get('unassigned') === 'true' ? 'unassigned' : (params.get('techId') || '');
  document.getElementById('tech-filter').value = tech;
}

document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { currentPage = 1; unreadOnly = false; loadTickets(); }, 300);
});
['status-filter', 'priority-filter', 'tech-filter', 'archived-filter'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { currentPage = 1; unreadOnly = false; loadTickets(); });
});
document.getElementById('reset-filters').addEventListener('click', resetFilters);
document.getElementById('refresh-btn').addEventListener('click', () => Promise.all([loadTickets(), loadSummary()]));
document.querySelectorAll('[data-summary-filter]').forEach(card => card.addEventListener('click', () => {
  const filter = card.dataset.summaryFilter;
  resetFilters(false);
  if (filter === 'unread') unreadOnly = true;
  else if (filter === 'unassigned') document.getElementById('tech-filter').value = 'unassigned';
  else document.getElementById('status-filter').value = filter;
  currentPage = 1;
  loadTickets();
}));

requireLogin().then(async loggedUser => {
  user = loggedUser;
  renderNav('requests');
  if (user.role !== 'ADMIN') document.getElementById('summary-unassigned-card').classList.add('hidden');
  try {
    await loadTechnicians();
    restoreFilters();
    await Promise.all([loadTickets(), loadSummary()]);
  } catch (err) {
    document.getElementById('tickets-loading').classList.add('hidden');
    const error = document.getElementById('tickets-error');
    error.textContent = err.message || 'Impossible de charger la gestion des tickets.';
    error.classList.remove('hidden');
  }
});
</script>
</body>
</html>
